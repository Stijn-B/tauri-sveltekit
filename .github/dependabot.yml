version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # SvelteKit and svelte-check currently support TypeScript through v6.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-non-major:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
