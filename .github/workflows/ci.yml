name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run sveltekit:build

  rust:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run sveltekit:build

      - name: Rust format check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --locked --all-targets --all-features
        working-directory: src-tauri

      - name: Rust build
        run: cargo build --locked
        working-directory: src-tauri

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Install Rust audit tool
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies strictly
        run: cargo audit --deny warnings
        working-directory: src-tauri

  integration:
    needs: [frontend, rust, security]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            bundles: deb,appimage,rpm
          - platform: macos-latest
            bundles: app
          - platform: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Integration build
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked

      - name: Verify native bundle output
        shell: bash
        env:
          TAURI_CI_PLATFORM: ${{ runner.os }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, statSync } from 'node:fs';
          const root = 'src-tauri/target/release/bundle';
          const entries = readdirSync(root, { recursive: true }).map(path => `${root}/${path}`);
          const suffixes = { Linux: ['.deb', '.AppImage', '.rpm'], macOS: ['.app'], Windows: ['-setup.exe'] };
          for (const suffix of suffixes[process.env.TAURI_CI_PLATFORM]) {
            const bundle = entries.find(path => path.endsWith(suffix));
            assert.ok(bundle, `Missing ${suffix} bundle`);
            const stats = statSync(bundle);
            assert.ok(suffix === '.app' ? stats.isDirectory() : stats.isFile() && stats.size > 0);
            if (suffix === '.app') {
              const executables = readdirSync(`${bundle}/Contents/MacOS`);
              assert.ok(executables.some(name => statSync(`${bundle}/Contents/MacOS/${name}`).size > 0));
            }
            console.log(`Verified ${bundle}`);
          }
          JS
